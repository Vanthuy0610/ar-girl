<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <!-- Thư viện đọc file GIF hoạt họa trong AR -->
    <script src="https://cdn.jsdelivr.net/gh/mayognaise/aframe-gif-shader@master/dist/aframe-gif-shader.min.js"></script>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; }
      .a-enter-vr, .a-enter-vr-button, .a-enter-ar, .a-orientation-modal, [vr-mode-ui] { display: none !important; }
    </style>
  </head>
  <body>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind?v=10; autoStart: true; uiLoading: yes; uiScanning: yes;" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0: Bắt được sẽ phát animation video.gif -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-entity geometry="primitive: plane; width: 1; height: 0.75" material="shader: gif; src: url(./video.gif?v=10); transparent: true" position="0 0 0.01"></a-entity>
      </a-entity>

      <!-- Target 1: Bắt được sẽ phát animation irwin.gif -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-entity geometry="primitive: plane; width: 1; height: 0.75" material="shader: gif; src: url(./irwin.gif?v=10); transparent: true" position="0 0 0.01"></a-entity>
      </a-entity>

    </a-scene>

  </body>
</html>
