<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; }
      .a-enter-vr, .a-enter-vr-button, .a-enter-ar, .a-orientation-modal, [vr-mode-ui] { display: none !important; }
      #start-btn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 15px 30px;
        font-size: 20px;
        font-weight: bold;
        color: white;
        background: #ff3b30;
        border: none;
        border-radius: 10px;
        z-index: 9999;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body>
    <button id="start-btn">Bấm vào đây để bắt đầu</button>
    
    <a-scene 
      mindar-image="imageTargetSrc: targets.mind?v=16; autoStart: false; uiLoading: yes; uiScanning: yes;" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="v1" src="video.mp4" crossorigin="anonymous" playsinline webkit-playsinline loop muted preload="auto"></video>
        <video id="v-irwin" src="irwin.mp4" crossorigin="anonymous" playsinline webkit-playsinline loop muted preload="auto"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="target1">
        <a-plane material="src: #v1; shader: flat; transparent: true" width="1" height="0.75" position="0 0 0.01"></a-plane>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1" id="target-irwin">
        <a-plane material="src: #v-irwin; shader: flat; transparent: true" width="1" height="0.75" position="0 0 0.01"></a-plane>
      </a-entity>
    </a-scene>

    <script>
      const startBtn = document.querySelector("#start-btn");
      const sceneEl = document.querySelector('a-scene');
      const v1 = document.querySelector("#v1");
      const vIrwin = document.querySelector("#v-irwin");

      startBtn.addEventListener("click", () => {
        // Mở khóa video ngay lập tức (Xóa bỏ đoạn code gây lỗi chữ vIrIrwin)
        v1.play();
        v1.pause();
        
        vIrwin.play();
        vIrwin.pause();
        
        startBtn.style.display = "none";
        sceneEl.systems["mindar-image-system"].start();
      });

      document.querySelector("#target1").addEventListener("targetFound", () => {
        vIrwin.pause();
        v1.play();
      });
      document.querySelector("#target1").addEventListener("targetLost", () => {
        v1.pause();
      });

      document.querySelector("#target-irwin").addEventListener("targetFound", () => {
        v1.pause();
        vIrwin.play();
      });
      document.querySelector("#target-irwin").addEventListener("targetLost", () => {
        vIrwin.pause();
      });
    </script>
  </body>
</html>
