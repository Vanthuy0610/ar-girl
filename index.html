<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR Girl</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; }
      .a-enter-vr, .a-enter-vr-button, .a-enter-ar, .a-orientation-modal, [vr-mode-ui] { display: none !important; }
      #start-btn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 15px 30px;
        font-size: 20px;
        font-weight: bold;
        color: white;
        background: #ff3b30;
        border: none;
        border-radius: 10px;
        z-index: 9999;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      }
      #start-btn:disabled {
        opacity: 0.7;
        cursor: wait;
      }
      #status {
        position: absolute;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        z-index: 9999;
        max-width: calc(100% - 32px);
        padding: 8px 12px;
        color: white;
        background: rgba(0, 0, 0, 0.65);
        border-radius: 8px;
        font: 14px/1.3 sans-serif;
        text-align: center;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <button id="start-btn">Bấm vào đây để bắt đầu</button>
    <div id="status" role="status" aria-live="polite">Đang tải AR...</div>
    
    <a-scene 
      mindar-image="imageTargetSrc: targets.mind?v=17; autoStart: false; uiLoading: yes; uiScanning: yes;" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="v1" src="video.mp4" playsinline webkit-playsinline loop muted preload="auto"></video>
        <video id="v-irwin" src="irwin.mp4" playsinline webkit-playsinline loop muted preload="auto"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="target1">
        <a-video src="#v1" width="1" height="0.75" position="0 0 0.01"></a-video>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1" id="target-irwin">
        <a-video src="#v-irwin" width="1" height="0.75" position="0 0 0.01"></a-video>
      </a-entity>
    </a-scene>

    <script>
      const startBtn = document.querySelector("#start-btn");
      const statusEl = document.querySelector("#status");
      const sceneEl = document.querySelector('a-scene');
      const v1 = document.querySelector("#v1");
      const vIrwin = document.querySelector("#v-irwin");
      const target1 = document.querySelector("#target1");
      const targetIrwin = document.querySelector("#target-irwin");

      let activeTarget = null;
      let startRequested = false;

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.style.background = isError
          ? "rgba(160, 0, 0, 0.85)"
          : "rgba(0, 0, 0, 0.65)";
      }

      function pauseVideo(video) {
        if (video && !video.paused) video.pause();
      }

      function resetVideo(video) {
        if (!video) return;
        try {
          if (video.readyState >= 1) video.currentTime = 0;
        } catch (error) {
          console.warn("Không thể tua video về đầu:", error);
        }
      }

      function playFromStart(video, targetName) {
        if (!video) return;
        video.muted = true;

        const playNow = () => {
          if (activeTarget !== targetName) return;
          resetVideo(video);
          const playPromise = video.play();
          if (playPromise && typeof playPromise.catch === "function") {
            playPromise.catch((error) => {
              console.error("Không thể phát video AR:", error);
              setStatus("Đã nhận diện nhưng trình duyệt không phát được video.", true);
            });
          }
        };

        if (video.readyState >= 1) {
          playNow();
        } else {
          video.addEventListener("loadedmetadata", playNow, { once: true });
        }
      }

      function activateTarget(targetName, video, label, otherVideo) {
        activeTarget = targetName;
        pauseVideo(otherVideo);
        setStatus(`Đã nhận diện ${label}`);
        playFromStart(video, targetName);
      }

      function deactivateTarget(targetName, video) {
        pauseVideo(video);
        if (activeTarget === targetName) {
          activeTarget = null;
          setStatus("Đưa camera về đúng hình để tiếp tục quét.");
        }
      }

      function unlockVideo(video) {
        if (!video) return;
        video.muted = true;
        video.setAttribute("muted", "");
        const playPromise = video.play();
        if (playPromise && typeof playPromise.then === "function") {
          playPromise.then(() => {
            window.setTimeout(() => {
              if (activeTarget === null) {
                pauseVideo(video);
                resetVideo(video);
              }
            }, 100);
          }).catch((error) => {
            console.warn("Không mở khóa được video:", error);
          });
        }
      }

      function startAR() {
        if (startRequested) return;

        const mindarSystem = sceneEl.systems && sceneEl.systems["mindar-image-system"];
        if (!mindarSystem) {
          setStatus("MindAR chưa tải xong. Hãy tải lại trang.", true);
          return;
        }

        startRequested = true;
        startBtn.disabled = true;
        setStatus("Đang xin quyền camera...");

        unlockVideo(v1);
        unlockVideo(vIrwin);

        try {
          const startPromise = mindarSystem.start();
          if (startPromise && typeof startPromise.catch === "function") {
            startPromise.catch((error) => {
              console.error("Không khởi động được MindAR:", error);
              startRequested = false;
              startBtn.disabled = false;
              setStatus("Không mở được camera hoặc MindAR.", true);
            });
          }
        } catch (error) {
          console.error("Không khởi động được MindAR:", error);
          startRequested = false;
          startBtn.disabled = false;
          setStatus("Không mở được camera hoặc MindAR.", true);
        }
      }

      startBtn.addEventListener("click", startAR);

      sceneEl.addEventListener("arReady", () => {
        startBtn.style.display = "none";
        setStatus("Camera đã sẵn sàng. Đưa camera về hình target.");
      });

      sceneEl.addEventListener("arError", (event) => {
        console.error("MindAR arError:", event.detail || event);
        startRequested = false;
        startBtn.disabled = false;
        startBtn.style.display = "block";
        setStatus("MindAR không khởi động được. Kiểm tra quyền camera và target.mind.", true);
      });

      target1.addEventListener("targetFound", () => {
        activateTarget("target-0", v1, "target 0", vIrwin);
      });
      target1.addEventListener("targetLost", () => {
        deactivateTarget("target-0", v1);
      });

      targetIrwin.addEventListener("targetFound", () => {
        activateTarget("target-1", vIrwin, "target 1", v1);
      });
      targetIrwin.addEventListener("targetLost", () => {
        deactivateTarget("target-1", vIrwin);
      });

      if (sceneEl.hasLoaded) {
        setStatus("Sẵn sàng. Bấm nút để mở camera.");
      } else {
        sceneEl.addEventListener("loaded", () => {
          setStatus("Sẵn sàng. Bấm nút để mở camera.");
        }, { once: true });
      }
    </script>
  </body>
</html>
