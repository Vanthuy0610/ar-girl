<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR Girl</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; }
      .a-enter-vr, .a-enter-vr-button, .a-enter-ar, .a-orientation-modal, [vr-mode-ui] { display: none !important; }
      #status {
        position: absolute;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        z-index: 9999;
        max-width: calc(100% - 32px);
        padding: 8px 12px;
        color: white;
        background: rgba(0, 0, 0, 0.65);
        border-radius: 8px;
        font: 14px/1.3 sans-serif;
        text-align: center;
        pointer-events: none;
      }
      #video-overlay {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(92vw, 560px, 100vh);
        width: min(92vw, 560px, 100dvh);
        z-index: 9998;
        visibility: hidden;
        pointer-events: none;
        background: #111;
        border: 2px solid white;
        border-radius: 8px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }
      #video-overlay.visible {
        visibility: visible;
        pointer-events: auto;
      }
      #video-overlay video {
        display: none;
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: contain;
        background: #111;
      }
      #video-overlay video.active {
        display: block;
      }
      @media (orientation: landscape) {
        #video-overlay {
          width: min(72vw, 720px, 100vh);
          width: min(72vw, 720px, 100dvh);
        }
        #status {
          bottom: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div id="status" role="status" aria-live="polite">Đang mở camera... Hãy cho phép truy cập khi trình duyệt hỏi.</div>
    <div id="video-overlay" aria-label="Video animation đang được phát">
      <video id="v-girl" src="video.mp4" crossorigin="anonymous" playsinline webkit-playsinline loop muted preload="auto" controls></video>
      <video id="v-irwin" src="irwin.mp4" crossorigin="anonymous" playsinline webkit-playsinline loop muted preload="auto" controls></video>
    </div>
    
    <a-scene 
      mindar-image="imageTargetSrc: targets.mind?v=17; autoStart: true; uiLoading: yes; uiScanning: yes;"
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="target-irwin">
        <a-plane material="shader: flat; src: #v-irwin; side: double" width="1" height="0.75" position="0 0 0.01"></a-plane>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1" id="target-girl">
        <a-plane material="shader: flat; src: #v-girl; side: double" width="1" height="0.75" position="0 0 0.01"></a-plane>
      </a-entity>
    </a-scene>

    <script>
      const statusEl = document.querySelector("#status");
      const sceneEl = document.querySelector('a-scene');
      const vGirl = document.querySelector("#v-girl");
      const vIrwin = document.querySelector("#v-irwin");
      const videoOverlay = document.querySelector("#video-overlay");
      const targetIrwin = document.querySelector("#target-irwin");
      const targetGirl = document.querySelector("#target-girl");

      let activeTarget = null;
      let hideVideoTimer = null;

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.style.background = isError
          ? "rgba(160, 0, 0, 0.85)"
          : "rgba(0, 0, 0, 0.65)";
      }

      function pauseVideo(video) {
        if (video && !video.paused) video.pause();
      }

      function resetVideo(video) {
        if (!video) return;
        try {
          if (video.readyState >= 1) video.currentTime = 0;
        } catch (error) {
          console.warn("Không thể tua video về đầu:", error);
        }
      }

      function playFromStart(video, targetName) {
        if (!video) return;
        video.muted = true;

        const playNow = () => {
          if (activeTarget !== targetName) return;
          resetVideo(video);
          const playPromise = video.play();
          if (playPromise && typeof playPromise.then === "function") {
            playPromise.catch((error) => {
              console.error("Không thể phát video AR:", error);
              setStatus("Đã nhận diện nhưng trình duyệt không phát được video.", true);
            });
          }
        };

        if (video.readyState >= 1) {
          playNow();
        } else {
          video.addEventListener("loadedmetadata", playNow, { once: true });
        }
      }

      function activateTarget(targetName, video, label, otherVideo) {
        window.clearTimeout(hideVideoTimer);
        activeTarget = targetName;
        pauseVideo(otherVideo);
        otherVideo.classList.remove("active");
        video.classList.add("active");
        videoOverlay.classList.add("visible");
        setStatus(`Đã nhận diện ${label}. Đang mở video...`);
        playFromStart(video, targetName);
      }

      function deactivateTarget(targetName, video) {
        if (activeTarget === targetName) {
          activeTarget = null;
          hideVideoTimer = window.setTimeout(() => {
            pauseVideo(video);
            video.classList.remove("active");
            videoOverlay.classList.remove("visible");
            setStatus("Đưa camera về đúng hình để tiếp tục quét.");
          }, 800);
        }
      }

      for (const video of [vGirl, vIrwin]) {
        video.addEventListener("playing", () => {
          if (video.classList.contains("active")) {
            setStatus("Video đang phát trên màn hình.");
          }
        });
        video.addEventListener("error", () => {
          console.error("Lỗi tải hoặc giải mã video:", video.error);
          if (video.classList.contains("active")) {
            setStatus("Không tải hoặc giải mã được video.", true);
          }
        });
      }

      sceneEl.addEventListener("arReady", () => {
        setStatus("Camera đã sẵn sàng. Đưa camera về hình target.");
      });

      sceneEl.addEventListener("arError", (event) => {
        console.error("MindAR arError:", event.detail || event);
        setStatus("Không mở được camera. Hãy cấp quyền trong trình duyệt rồi tải lại trang.", true);
      });

      targetIrwin.addEventListener("targetFound", () => {
        activateTarget("target-0", vIrwin, "Irwin", vGirl);
      });
      targetIrwin.addEventListener("targetLost", () => {
        deactivateTarget("target-0", vIrwin);
      });

      targetGirl.addEventListener("targetFound", () => {
        activateTarget("target-1", vGirl, "cô gái", vIrwin);
      });
      targetGirl.addEventListener("targetLost", () => {
        deactivateTarget("target-1", vGirl);
      });

    </script>
  </body>
</html>
