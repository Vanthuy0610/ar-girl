<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: fixed;
      }
      .a-enter-vr, .a-enter-vr-button, .a-enter-ar, .a-orientation-modal, [vr-mode-ui] {
        display: none !important;
      }
    </style>
  </head>
  <body>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights">
      
      <a-assets>
        <video id="v1" src="./video.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
        <video id="v-irwin" src="./irwin.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="target1">
        <a-video src="#v1" width="1" height="1" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1" id="target-irwin">
        <a-video src="#v-irwin" width="1" height="1" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>

    </a-scene>

    <script>
      const v1 = document.querySelector("#v1");
      const vIrwin = document.querySelector("#v-irwin");

      // Bắt buộc bật Tắt tiếng (muted) bằng JavaScript để vượt qua trình chặn di động
      if (v1) v1.muted = true;
      if (vIrwin) vIrwin.muted = true;

      // Mở khóa quyền phát video ngầm khi chạm vào màn hình lần đầu
      const unlockVideos = () => {
        if (v1) v1.play().then(() => v1.pause()).catch(() => {});
        if (vIrwin) vIrwin.play().then(() => vIrwin.pause()).catch(() => {});
        window.removeEventListener("touchstart", unlockVideos);
        window.removeEventListener("click", unlockVideos);
      };
      window.addEventListener("touchstart", unlockVideos);
      window.addEventListener("click", unlockVideos);

      // Khi quét thấy ảnh 1
      document.querySelector("#target1").addEventListener("targetFound", () => {
        if (v1) {
          v1.muted = true;
          v1.play().catch(e => console.log(e));
        }
      });
      document.querySelector("#target1").addEventListener("targetLost", () => {
        if (v1) v1.pause();
      });

      // Khi quét thấy ảnh Irwin
      document.querySelector("#target-irwin").addEventListener("targetFound", () => {
        if (vIrwin) {
          vIrwin.muted = true;
          vIrwin.play().catch(e => console.log(e));
        }
      });
      document.querySelector("#target-irwin").addEventListener("targetLost", () => {
        if (vIrwin) vIrwin.pause();
      });
    </script>
  </body>
</html>
