<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: fixed;
      }
      /* Ẩn hoàn toàn nút VR/AR dư thừa */
      .a-enter-vr, .a-enter-vr-button, .a-enter-ar, .a-orientation-modal, [vr-mode-ui] {
        display: none !important;
      }
    </style>
  </head>
  <body>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights">
      
      <a-assets>
        <!-- Hoạt ảnh/Video Nhân vật 1 -->
        <video id="v1" src="./video.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
        <!-- Hoạt ảnh/Video Nhân vật Irwin -->
        <video id="v-irwin" src="./irwin.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Vùng 1: Đè lên Ảnh Nhân vật 1 (targetIndex: 0) -->
      <a-entity mindar-image-target="targetIndex: 0" id="target1">
        <a-video src="#v1" width="1" height="1" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>

      <!-- Vùng 2: Đè lên Ảnh Irwin (targetIndex: 1) -->
      <a-entity mindar-image-target="targetIndex: 1" id="target-irwin">
        <a-video src="#v-irwin" width="1" height="1" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>

    </a-scene>

    <script>
      // Xóa nút VR tự động
      setInterval(() => {
        const vrBtn = document.querySelector('.a-enter-vr');
        if (vrBtn) vrBtn.remove();
      }, 100);

      const v1 = document.querySelector("#v1");
      const vIrwin = document.querySelector("#v-irwin");

      // Quét thấy Ảnh 1 -> Hiện và chạy hoạt ảnh Nhân vật 1
      document.querySelector("#target1").addEventListener("targetFound", () => v1.play());
      document.querySelector("#target1").addEventListener("targetLost", () => v1.pause());

      // Quét thấy Ảnh Irwin -> Hiện và chạy hoạt ảnh Irwin
      document.querySelector("#target-irwin").addEventListener("targetFound", () => vIrwin.play());
      document.querySelector("#target-irwin").addEventListener("targetLost", () => vIrwin.pause());
    </script>
  </body>
</html>
