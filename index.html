<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; }
      .a-enter-vr, .a-enter-vr-button, .a-enter-ar, .a-orientation-modal, [vr-mode-ui] { display: none !important; }
      
      /* Giao diện nút bấm mở khóa video */
      #start-btn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 15px 30px;
        font-size: 20px;
        font-weight: bold;
        color: white;
        background: #ff3b30;
        border: none;
        border-radius: 10px;
        z-index: 9999;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body>

    <!-- Nút chạm để cấp quyền cho trình duyệt -->
    <button id="start-btn">Bấm vào đây để bắt đầu</button>

    <!-- Thêm autoStart: false để chờ người dùng bấm nút mới bật Camera -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind?v=13; autoStart: false; uiLoading: yes; uiScanning: yes;" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="v1" src="./video.mp4?v=13" preload="auto" loop muted playsinline webkit-playsinline></video>
        <video id="v-irwin" src="./irwin.mp4?v=13" preload="auto" loop muted playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="target1">
        <a-video src="#v1" width="1" height="0.75" position="0 0 0.01"></a-video>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1" id="target-irwin">
        <a-video src="#v-irwin" width="1" height="0.75" position="0 0 0.01"></a-video>
      </a-entity>

    </a-scene>

    <script>
      const startBtn = document.querySelector("#start-btn");
      const sceneEl = document.querySelector('a-scene');
      const v1 = document.querySelector("#v1");
      const vIrwin = document.querySelector("#v-irwin");

      // Ép tắt tiếng để đảm bảo không bị chặn
      if (v1) v1.muted = true;
      if (vIrwin) vIrwin.muted = true;

      // Khi người dùng bấm nút: Mở khóa video & Bật camera
      startBtn.addEventListener("click", () => {
        // Play nhấp nháy 1 lần để trình duyệt cấp quyền, sau đó pause ngay
        if (v1) { v1.play().catch(()=>{}); v1.pause(); }
        if (vIrwin) { vIrwin.play().catch(()=>{}); vIrwin.pause(); }
        
        // Ẩn nút đi và kích hoạt MindAR Camera
        startBtn.style.display = "none";
        sceneEl.systems["mindar-image-system"].start();
      });

      // Bắt đầu phát khi nhận diện được khung tranh
      document.querySelector("#target1").addEventListener("targetFound", () => {
        if (vIrwin) vIrwin.pause();
        if (v1) { v1.currentTime = 0; v1.play().catch(() => {}); }
      });
      document.querySelector("#target1").addEventListener("targetLost", () => {
        if (v1) v1.pause();
      });

      document.querySelector("#target-irwin").addEventListener("targetFound", () => {
        if (v1) v1.pause();
        if (vIrwin) { vIrwin.currentTime = 0; vIrwin.play().catch(() => {}); }
      });
      document.querySelector("#target-irwin").addEventListener("targetLost", () => {
        if (vIrwin) vIrwin.pause();
      });
    </script>
  </body>
</html>
